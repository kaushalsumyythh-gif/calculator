<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Simple Calculator</h1>

    <section class="calculator" aria-label="Calculator">
      <div class="screen">
        <div class="expression" id="expression" aria-hidden="true">&nbsp;</div>
        <output class="display" id="display" aria-live="polite">0</output>
      </div>

      <div class="keys" id="keys">
        <button class="key key-util" data-action="clear" aria-label="Clear all">C</button>
        <button class="key key-util" data-action="backspace" aria-label="Backspace">&#9003;</button>
        <button class="key key-util" data-action="negate" aria-label="Change sign">&plusmn;</button>
        <button class="key key-op" data-action="operator" data-value="/" aria-label="Divide">&divide;</button>

        <button class="key key-num" data-action="digit" data-value="7">7</button>
        <button class="key key-num" data-action="digit" data-value="8">8</button>
        <button class="key key-num" data-action="digit" data-value="9">9</button>
        <button class="key key-op" data-action="operator" data-value="*" aria-label="Multiply">&times;</button>

        <button class="key key-num" data-action="digit" data-value="4">4</button>
        <button class="key key-num" data-action="digit" data-value="5">5</button>
        <button class="key key-num" data-action="digit" data-value="6">6</button>
        <button class="key key-op" data-action="operator" data-value="-" aria-label="Subtract">&minus;</button>

        <button class="key key-num" data-action="digit" data-value="1">1</button>
        <button class="key key-num" data-action="digit" data-value="2">2</button>
        <button class="key key-num" data-action="digit" data-value="3">3</button>
        <button class="key key-op" data-action="operator" data-value="+" aria-label="Add">+</button>

        <button class="key key-num key-zero" data-action="digit" data-value="0">0</button>
        <button class="key key-num" data-action="decimal" aria-label="Decimal point">.</button>
        <button class="key key-equals" data-action="equals" aria-label="Equals">=</button>
      </div>
    </section>

    <p class="hint">
      Keyboard works too: digits, <kbd>+</kbd> <kbd>-</kbd> <kbd>*</kbd> <kbd>/</kbd>,
      <kbd>Enter</kbd> for equals, <kbd>Backspace</kbd> to delete and <kbd>Esc</kbd> to clear.
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
